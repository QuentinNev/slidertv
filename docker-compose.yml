services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slidertv-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0
      TZ: UTC
      LOG_LEVEL: info
    volumes:
      # Persist storage directory (uploads, slides, database)
      - storage_volume:/app/storage
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  storage_volume:
    driver: local
